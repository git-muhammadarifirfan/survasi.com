name: Automatic Deploy to VM (Docker)

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    name: Deploy to Production VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_IP }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          passphrase: ${{ secrets.VM_SSH_PASSPHRASE }} # Optional if SSH key has password
          port: ${{ secrets.VM_PORT || 22 }}
          script: |
            cd /var/www/survasi.com || cd ~/survasi.com
            git pull origin main || git pull origin master
            docker compose -f deployment/docker-compose.yml up -d --build --remove-orphans
            docker image prune -f
