# ==============================================================================
# NGINX CONFIGURATION — BSAN JAWA TIMUR MONITORING SYSTEM
# Optimized for 2GB RAM / 2 vCPU Core VM Server
# ==============================================================================

user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    # ── Basic Settings ─────────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # Mask Nginx version for security

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Buffer Tuning for Low-Memory VM (2GB RAM) ──────────────────────────────
    client_body_buffer_size 128k;
    client_max_body_size 15M;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    output_buffers 1 32k;
    postpone_output 1460;

    # ── Anti-DDoS Rate Limiting Zones ──────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=3r/m;

    # ── Logging Setup ─────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # ── Gzip Compression (CWV Optimization) ──────────────────────────────────
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/svg+xml
        image/x-icon
        text/css
        text/plain
        text/x-component;

    # ── Virtual Host Configuration ─────────────────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name _ your-domain.com; # Replace with your domain

        # Redirect HTTP to HTTPS (uncomment when SSL certificate is configured)
        # return 301 https://$host$request_uri;

        root /var/www/survasi/dist;
        index index.html;

        # ── Security Headers ───────────────────────────────────────────────────
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ── Frontend Static SPA Handling ──────────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # ── Aggressive Caching for Static JS/CSS Assets (CWV Score 100) ───────
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # ── Favicon & Images Caching ──────────────────────────────────────────
        location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
            access_log off;
        }

        # ── Reverse Proxy to Express Backend API ──────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Low RAM Proxy Buffers
            proxy_buffers 8 16k;
            proxy_buffer_size 16k;
            proxy_read_timeout 60s;
            proxy_connect_timeout 60s;
        }

        # ── Stricter Rate Limiting for Auth Login Endpoint ─────────────────────
        location /api/auth/login {
            limit_req zone=login_limit burst=5 nodelay;

            proxy_pass http://127.0.0.1:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Deny Access to Hidden Files ────────────────────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
