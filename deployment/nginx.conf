# ==============================================================================
# CLOUDPANEL NGINX VHOST CONFIGURATION — BSAN SURVASI
# Copy content ini ke CloudPanel -> Sites -> survasi.com -> Vhost
# ==============================================================================

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name www.survasi.com;
  return 301 https://survasi.com$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  listen 443 quic;
  listen 443 ssl;
  listen [::]:443 quic;
  listen [::]:443 ssl;
  http2 on;
  http3 off;
  {{ssl_certificate_key}}
  {{ssl_certificate}}
  server_name survasi.com www1.survasi.com;
  {{root}}

  {{nginx_access_log}}
  {{nginx_error_log}}

  # ── 0. Fix ERR_TOO_MANY_REDIRECTS untuk Cloudflare Flexible SSL ─────────────
  # Karena Cloudflare diset ke "Flexible SSL" dan terhubung ke server via HTTP (Port 80),
  # Nginx TIDAK boleh meredirect HTTP ke HTTPS agar tidak terjadi infinite loop.


  location ~ /.well-known {
    auth_basic off;
    allow all;
  }

  {{settings}}

  include /etc/nginx/global_settings;

  index index.html;

  # ── 1. Frontend Static SPA Handling (dist folder) ───────────────────────────
  location / {
    try_files $uri $uri/ /index.html;
  }

  # ── 2. Aggressive Caching for Assets ────────────────────────────────────────
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # ── 3. Reverse Proxy for Backend API (PM2 Port 3001) ────────────────────────
  location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Server $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_pass_request_headers on;
    proxy_max_temp_file_size 0;
    proxy_connect_timeout 900;
    proxy_send_timeout 900;
    proxy_read_timeout 900;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    proxy_temp_file_write_size 256k;
  }
}

